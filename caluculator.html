<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mini Caluculator</title>

    <style>
        .tab {

            width: 100px;
            height: 50px;
            align-content: center;
            background-color: aqua;
            text-align: center;

        }

       .displayy{
        color: blue;
        text-align: center;
        size:  20px;
        
       } 
    </style>

</head>

<body>

    <div class = "displayy"> 

      

    </div>

        <div class="tab"> CE </div>

    </div>

    </div>

    <div style="display: flex; flex-direction: row; gap: 20px; margin-top: 20px;">

        <div class="tab"> 6 </div>

    </div>

</html>
