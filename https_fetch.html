<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HttpsFetch</title>

    <style>
        body {
            margin: 0;
            display: flex;
            height: 100vh;
            justify-content: center;
            align-items: center;
            flex: 1;
            background-color: white;

        }

        .cardbg {

            margin: 40px;
            padding: 10px;
            border-radius: 8px;
            background-color: white;
            width: 900px;
            min-height: 300px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            box-shadow: 0 6px 18px rgba(0, 0, 0, 0.4);
            position: relative
        }

        #text_id {
            font-size: 1.2rem;
            text-align: center;
            margin-bottom: 10px;
        }

        .button-row {
            display: flex;
            justify-content: flex-end;
            width: 100%;
        }

        #btnquote {
            align-self: center;
            background-color: dimgrey;
            color: white;
            border: none;
            padding: 8px 16px;
            border-radius: 4px;
            cursor: pointer;
            position: absolute;
            bottom: 20px;
            right: 20px;
        }

        .author_id {
            color: grey;
            font-style: italic;
            margin-bottom: 10px;
        }

        .big-quote {
            font-size: rem;
            font-weight: bold;
            vertical-align: top;
        }
    </style>
</head>

<body>




    <div class="cardbg">

        <span id="text_id"> </span> </br>
        <span id="author_id"> </span> </br>
        <!-- <span id="tag_id"> </span> </br> -->

        </br>
        </br>
        <div class="button-row">
            <button id="btnquote"> Get Quote</button>
        </div>
    </div>

</body>

<script src=fetch.js></script>

</html>
